<h1>方塊倖存者（Cubeland Survivors）支援</h1>
<h2>聯絡我們</h2>
<p>遇到問題、有建議，或購買後沒有拿到物品，請來信：josephhsu082814@gmail.com<br>來信時請附上手機型號、iOS 版本，以及問題的截圖。</p>
<h2>常見問題</h2>
<p><b>購買後沒有拿到愛心幣或裝備？</b><br>請先確認網路連線，重新開啟遊戲；如果還是沒有，請來信並附上 Apple 的購買收據。</p>
<p><b>換手機後火龍禮包不見了？</b><br>在「商店 → 寶物」按「恢復購買」，用同一個 Apple ID 就能拿回來。</p>
<p><b>遊戲進度會不見嗎？</b><br>進度存在手機裡。刪除 App 會一併刪除進度（火龍禮包可以用「恢復購買」拿回）。</p>
